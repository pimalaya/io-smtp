[package]
name = "io-smtp"
description = "SMTP client and server library for Rust"
version = "0.9.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["email", "no-std"]
keywords = ["email", "smtp", "client", "std", "io-free"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-smtp/latest/io_smtp"
repository = "https://github.com/pimalaya/io-smtp"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client", "scram", "rustls-ring"]
client = ["io-sasl/client"]
server = ["io-sasl/server"]
std = ["client"]
scram = ["io-sasl/scram"]
url = ["dep:url"]
rustls-ring = ["std", "url", "pimalaya-stream/rustls-ring", "dep:anyhow", "dep:rand"]
rustls-aws  = ["std", "url", "pimalaya-stream/rustls-aws", "dep:anyhow", "dep:rand"]
native-tls  = ["std", "url", "pimalaya-stream/native-tls", "dep:anyhow", "dep:rand"]
vendored = ["pimalaya-stream/vendored"]

[[example]]
name = "std_coroutine"
path = "examples/std_coroutine.rs"
required-features = ["client"]

[[example]]
name = "tokio_coroutine"
path = "examples/tokio_coroutine.rs"
required-features = ["client"]

[[example]]
name = "tokio_session"
path = "examples/tokio_session.rs"
required-features = ["std", "url"]

[[example]]
name = "std_client_light"
path = "examples/std_client_light.rs"
required-features = ["std"]

[[example]]
name = "std_client_full"
path = "examples/std_client_full.rs"
required-features = ["rustls-ring"]

[dev-dependencies]
bounded-static = { version = "0.8", default-features = false, features = ["alloc"] }
env_logger = "0.11"
hmac = "0.13"
io-oauth = { version = "0.7", default-features = false, features = ["jwt-bearer", "rustls-ring"] }
io-sasl = { version = "0.2", default-features = false }
pbkdf2 = { version = "0.13", features = ["hmac"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-rustls = "0.26"
url = "2"

[dependencies]
anyhow = { version = "1", optional = true }
base64-codec = { version = "0.1", default-features = false, features = ["alloc"] }
bounded-static = { version = "0.8", default-features = false, features = ["alloc"] }
bounded-static-derive = { version = "0.8", default-features = false }
chumsky = { version = "0.13", default-features = false }
io-sasl = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
pimalaya-stream = { version = "0.4", default-features = false, optional = true }
rand = { version = "0.10", default-features = false, features = ["thread_rng"], optional = true }
secrecy = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
url = { version = "2", default-features = false, optional = true }

[patch.crates-io]
io-sasl = { path = "../io-sasl" }
