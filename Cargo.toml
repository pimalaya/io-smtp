[package]
name = "io-smtp"
description = "SMTP client library for Rust"
version = "0.3.0"
authors = ["soywod <pimalaya.org@posteo.net>"]
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["email", "no-std"]
keywords = ["email", "smtp", "client", "std", "io-free"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-smtp/latest/io_smtp"
repository = "https://github.com/pimalaya/io-smtp"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["scram", "rustls-ring"]
scram = ["dep:rand", "io-sasl/scram"]
url = ["dep:url"]
client = []
rustls-ring = ["client", "url", "pimalaya-stream/rustls-ring", "dep:anyhow"]
rustls-aws  = ["client", "url", "pimalaya-stream/rustls-aws", "dep:anyhow"]
native-tls  = ["client", "url", "pimalaya-stream/native-tls", "dep:anyhow"]
vendored = ["pimalaya-stream/vendored"]

[[example]]
name = "std_coroutine"
path = "examples/std_coroutine.rs"

[[example]]
name = "tokio_coroutine"
path = "examples/tokio_coroutine.rs"

[[example]]
name = "tokio_session"
path = "examples/tokio_session.rs"
required-features = ["url"]

[[example]]
name = "std_client_light"
path = "examples/std_client_light.rs"
required-features = ["client"]

[[example]]
name = "std_client_full"
path = "examples/std_client_full.rs"
required-features = ["rustls-ring"]

[dev-dependencies]
env_logger = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", features = ["hmac"] }
sha2 = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tokio-rustls = "0.26"
url = "2"

[dependencies]
anyhow = { version = "1", optional = true }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
bounded-static = { version = "0.8", default-features = false, features = ["alloc"] }
bounded-static-derive = { version = "0.8", default-features = false }
chumsky = { version = "0.13", default-features = false }
io-sasl = { version = "0.1", default-features = false }
log = { version = "0.4", default-features = false }
pimalaya-stream = { version = "0.3", default-features = false, optional = true }
rand = { version = "0.10", optional = true }
secrecy = { version = "0.10", default-features = false }
thiserror = { version = "2", default-features = false }
url = { version = "2.2", default-features = false, optional = true }
